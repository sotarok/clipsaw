services:
  clipsaw:
    build:
      context: .
      target: dev
    ports:
      - "3501:3501"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
      - ./input:/media/input:ro
      - ./output:/media/output
      - ./data:/media/data
    environment:
      - NODE_ENV=development
    command: npm run dev -- --hostname 0.0.0.0 --port 3501
